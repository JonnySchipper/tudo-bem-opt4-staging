    <style>html,body{background:#1d1b26;height:100%;margin:0;overflow:hidden}#game{position:fixed;inset:0}#game canvas{image-rendering:pixelated;display:block}#hud{left:0;right:0;bottom:max(10px, env(safe-area-inset-bottom));pointer-events:none;justify-content:center;display:flex;position:fixed}#hud.hidden,#credit.hidden{display:none}#bar{pointer-events:auto;color:#f5e6d3;background:#1d1b26b8;border:1px solid #f5e6d32e;border-radius:999px;align-items:center;gap:10px;max-width:calc(100vw - 32px);padding:6px 12px;font:800 13px/1 Nunito,system-ui,sans-serif;display:flex}#bar button{all:unset;cursor:pointer;text-align:center;color:#2c2c2c;background:#d4a017;border-radius:50%;width:26px;height:26px;font-size:11px;line-height:26px}#time{accent-color:#d4a017;width:min(280px,46vw)}#time-label{font-variant-numeric:tabular-nums;text-align:right;min-width:3.4em}#credit{color:#f5e6d3c7;text-shadow:0 1px 2px #0009;pointer-events:none;font:600 11px/1 Nunito,system-ui,sans-serif;position:fixed;top:8px;right:10px}#credit a{color:inherit;pointer-events:auto}#world-labels{pointer-events:none;font-family:Nunito,system-ui,sans-serif;position:fixed;inset:0;overflow:hidden}#world-labels>*{will-change:transform;position:absolute;top:0;left:0}.plate{color:#f5e6d3;white-space:nowrap;border-radius:999px;padding:2px 7px 3px;font-size:11px;font-weight:800;line-height:1.1;box-shadow:0 1px #00000059}.plate-npc{background:#c45c26}.plate-player{background:#2f5d50}.plate-me{background:#2f5d50;box-shadow:0 0 0 2px #d4a017,0 1px 0 2px #00000059}.bubble{color:#2c2c2c;background:#f8f3ea;border-radius:4px;max-width:210px;padding:5px 9px 6px;box-shadow:0 0 0 2px #3a3a50,0 3px 0 2px #3a3a50}.bubble .pt{font-size:12px;font-weight:800;line-height:1.25}.bubble .en{color:#6a6660;margin-top:2px;font-size:10.5px;font-style:italic;font-weight:600;line-height:1.2}#err{color:#ff9a9a;white-space:pre-wrap;font:12px monospace;position:fixed;top:8px;left:8px}</style>
